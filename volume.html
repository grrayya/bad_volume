<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Sisyphus Volume Slider</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #1e272e;
            color: #d2dae2;
            overflow: hidden;
        }

        h1 {
            margin-bottom: 10px;
        }

        p {
            color: #808e9b;
            margin-bottom: 40px;
        }

        #volume-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        input[type="range"] {
            -webkit-appearance: slider-vertical;
            width: 20px;
            height: 300px;
            cursor: grab;
        }
        
        input[type="range"]:active {
            cursor: grabbing;
        }

        #volume-display {
            font-size: 3rem;
            font-weight: bold;
            color: #0fbcf9;
            width: 150px;
            text-align: center;
        }

        #lock-btn {
            position: fixed;
            bottom: 20%;
            left: 50%;
            transform: translateX(-50%);
            padding: 15px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            background: #ff3f34;
            color: white;
            border: none;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            /* Instant teleportation, no smooth transitions to give them hope */
        }

        #status {
            margin-top: 20px;
            font-size: 1.2rem;
            color: #ff3f34;
            font-weight: bold;
            height: 30px;
        }
    </style>
</head>
<body>

    <h1>Adjust System Volume</h1>
    <p>Drag to desired level and lock it. Good luck.</p>

    <div id="volume-container">
        <div id="volume-display">0%</div>
        <input type="range" id="volume-slider" min="0" max="100" value="0">
    </div>

    <div id="status"></div>
    <button id="lock-btn">Lock Volume</button>

    <script>
        const slider = document.getElementById('volume-slider');
        const display = document.getElementById('volume-display');
        const lockBtn = document.getElementById('lock-btn');
        const status = document.getElementById('status');
        
        // The Gravity Engine
        // Constantly pulls the slider down to 0
        setInterval(() => {
            if (slider.value > 0) {
                slider.value = parseInt(slider.value) - 1;
                display.innerText = slider.value + '%';
            }
        }, 60);

        // Update display when user drags
        slider.addEventListener('input', () => {
